services:
  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_LOCAL_POSTGRES_PASSWORD:?set LANGFUSE_LOCAL_POSTGRES_PASSWORD}@langfuse-db:5432/langfuse
      DIRECT_URL: postgresql://langfuse:${LANGFUSE_LOCAL_POSTGRES_PASSWORD:?set LANGFUSE_LOCAL_POSTGRES_PASSWORD}@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_LOCAL_CLICKHOUSE_PASSWORD:?set LANGFUSE_LOCAL_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_LOCAL_REDIS_PASSWORD:?set LANGFUSE_LOCAL_REDIS_PASSWORD}
      SALT: ${LANGFUSE_LOCAL_SALT:?set LANGFUSE_LOCAL_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_LOCAL_ENCRYPTION_KEY:?set LANGFUSE_LOCAL_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_LOCAL_NEXTAUTH_SECRET:?set LANGFUSE_LOCAL_NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_LOCAL_MINIO_ACCESS_KEY:?set LANGFUSE_LOCAL_MINIO_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_LOCAL_MINIO_SECRET_KEY:?set LANGFUSE_LOCAL_MINIO_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_LOCAL_MINIO_ACCESS_KEY:?set LANGFUSE_LOCAL_MINIO_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_LOCAL_MINIO_SECRET_KEY:?set LANGFUSE_LOCAL_MINIO_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_INIT_ORG_ID: suanming-local
      LANGFUSE_INIT_ORG_NAME: suanming-local
      LANGFUSE_INIT_PROJECT_ID: agent-runtime
      LANGFUSE_INIT_PROJECT_NAME: agent-runtime
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_LOCAL_PROJECT_PUBLIC_KEY:?set LANGFUSE_LOCAL_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_LOCAL_PROJECT_SECRET_KEY:?set LANGFUSE_LOCAL_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: local@example.com
      LANGFUSE_INIT_USER_NAME: local-admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_LOCAL_ADMIN_PASSWORD:?set LANGFUSE_LOCAL_ADMIN_PASSWORD}
      AUTH_DISABLE_SIGNUP: "false"
    restart: unless-stopped

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_LOCAL_POSTGRES_PASSWORD:?set LANGFUSE_LOCAL_POSTGRES_PASSWORD}@langfuse-db:5432/langfuse
      DIRECT_URL: postgresql://langfuse:${LANGFUSE_LOCAL_POSTGRES_PASSWORD:?set LANGFUSE_LOCAL_POSTGRES_PASSWORD}@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_LOCAL_CLICKHOUSE_PASSWORD:?set LANGFUSE_LOCAL_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_LOCAL_REDIS_PASSWORD:?set LANGFUSE_LOCAL_REDIS_PASSWORD}
      SALT: ${LANGFUSE_LOCAL_SALT:?set LANGFUSE_LOCAL_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_LOCAL_ENCRYPTION_KEY:?set LANGFUSE_LOCAL_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_LOCAL_NEXTAUTH_SECRET:?set LANGFUSE_LOCAL_NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_LOCAL_MINIO_ACCESS_KEY:?set LANGFUSE_LOCAL_MINIO_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_LOCAL_MINIO_SECRET_KEY:?set LANGFUSE_LOCAL_MINIO_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_LOCAL_MINIO_ACCESS_KEY:?set LANGFUSE_LOCAL_MINIO_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_LOCAL_MINIO_SECRET_KEY:?set LANGFUSE_LOCAL_MINIO_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    restart: unless-stopped

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_LOCAL_POSTGRES_PASSWORD:?set LANGFUSE_LOCAL_POSTGRES_PASSWORD}
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_LOCAL_CLICKHOUSE_PASSWORD:?set LANGFUSE_LOCAL_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  langfuse-redis:
    image: docker.io/redis:7
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_LOCAL_REDIS_PASSWORD:?set LANGFUSE_LOCAL_REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_LOCAL_REDIS_PASSWORD:?set LANGFUSE_LOCAL_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  langfuse-minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_LOCAL_MINIO_ACCESS_KEY:?set LANGFUSE_LOCAL_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_LOCAL_MINIO_SECRET_KEY:?set LANGFUSE_LOCAL_MINIO_SECRET_KEY}
    ports:
      - "9090:9000"
      - "9001:9001"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  langfuse-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://langfuse-minio:9000 ${LANGFUSE_LOCAL_MINIO_ACCESS_KEY:?set LANGFUSE_LOCAL_MINIO_ACCESS_KEY} ${LANGFUSE_LOCAL_MINIO_SECRET_KEY:?set LANGFUSE_LOCAL_MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/langfuse
      "

volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-minio-data:
